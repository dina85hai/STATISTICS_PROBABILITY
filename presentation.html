// App State
let currentSlide = 0;
let selectedAnswer = null;
let activeAnimationId = null;
let audioContext = null;

// Quiz State
window.currentQuizQuestionIndex = 0;
window.quizAnswerRevealed = false;

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    renderSlide();
    
    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevSlide();
        }
    });
});

function nextSlide() {
    if (currentSlide < slides.length - 1) {
        currentSlide++;
        selectedAnswer = null;
        renderSlide();
    }
}

function prevSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        selectedAnswer = null;
        renderSlide();
    }
}

function cancelAnimations() {
    if (activeAnimationId) {
        cancelAnimationFrame(activeAnimationId);
        activeAnimationId = null;
    }
}

// Answer Selection Logic for Practice Slides
window.selectAnswer = function(index) {
    selectedAnswer = index;
    const slide = slides[currentSlide];
    const buttonsContainer = document.getElementById('practice-options');
    if (!buttonsContainer) return;

    buttonsContainer.innerHTML = slide.options.map((opt, i) => {
        const isSelected = selectedAnswer === i;
        const isCorrect = opt.correct;
        
        let btnClass = 'bg-slate-700/50 border-purple-400/30 hover:border-purple-400 hover:scale-105';
        if (isSelected && isCorrect) btnClass = 'bg-green-500/30 border-green-500 scale-105';
        else if (isSelected && !isCorrect) btnClass = 'bg-red-500/30 border-red-500';
        else if (isCorrect && selectedAnswer !== null) btnClass = 'bg-green-500/20 border-green-500';
        else if (selectedAnswer !== null) btnClass = 'bg-slate-700/30 border-slate-600/30 opacity-50';

        return `
            <button onclick="window.selectAnswer(${i})" class="rounded-xl p-3 md:p-6 text-white text-sm md:text-xl text-center border-2 transition-all cursor-pointer flex flex-col items-center justify-center ${btnClass}">
                <span>${opt.label}</span>
                ${isSelected && isCorrect ? '<div class="text-green-400 text-xl md:text-3xl mt-1 md:mt-2 font-bold">✓</div>' : ''}
                ${isSelected && !isCorrect ? '<div class="text-red-400 text-xl md:text-3xl mt-1 md:mt-2 font-bold">✗</div>' : ''}
            </button>
        `;
    }).join('');

    const answerContainer = document.getElementById('practice-answer');
    if (selectedAnswer !== null) {
        answerContainer.innerHTML = `<div class="mt-4 animate-fadeIn"><p class="text-green-400 text-center text-sm md:text-lg font-bold">${slide.answer}</p></div>`;
    }
};

window.setQuizIndex = function(idx) {
    window.currentQuizQuestionIndex = idx;
    window.quizAnswerRevealed = false;
    renderSlide();
};

window.nextQuizQuestion = function() {
    if (window.currentQuizQuestionIndex < practiceQuestions.length - 1) {
        window.currentQuizQuestionIndex++;
        window.quizAnswerRevealed = false;
        renderSlide();
    }
};

window.prevQuizQuestion = function() {
    if (window.currentQuizQuestionIndex > 0) {
        window.currentQuizQuestionIndex--;
        window.quizAnswerRevealed = false;
        renderSlide();
    }
};

window.goHome = function() {
    currentSlide = 0;
    window.quizAnswerRevealed = false;
    renderSlide();
};

window.toggleQuizAnswer = function() {
    window.quizAnswerRevealed = !window.quizAnswerRevealed;
    const ans = document.getElementById('quiz-answer-content');
    const btn = document.getElementById('quiz-reveal-btn');
    if (ans && btn) {
        if (window.quizAnswerRevealed) {
            ans.classList.remove('hidden');
            ans.classList.add('animate-fadeIn');
            btn.innerText = 'Hide Answer';
        } else {
            ans.classList.add('hidden');
            ans.classList.remove('animate-fadeIn');
            btn.innerText = 'Reveal Answer';
        }
    }
};

                    <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-300 to-green-600 text-center mt-6 md:mt-10 drop-shadow-[0_0_15px_rgba(74,222,128,0.5)] md:scale-110 transform md:rotate-[-2deg]">${slide.badge}</h1>
                </div>
            </div>
        `;
    }
    else if (slide.type === 'final') {
        const achHtml = slide.achievements.map(ach => `<p class="text-green-300 text-base md:text-2xl my-2 md:my-3 font-bold tracking-wide">${ach}</p>`).join('');
        
        html = `
            <div class="animate-fadeIn max-w-4xl w-full text-center">
                <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-pink-300 mb-6 md:mb-8 drop-shadow-xl">${slide.title}</h1>
                <div class="bg-slate-800/80 rounded-2xl p-5 md:p-8 border-2 border-purple-400/30 shadow-[0_0_50px_rgba(139,92,246,0.3)]">
                    <div class="bg-slate-900/50 rounded-xl p-4 md:p-6 mb-6 md:mb-8 border border-slate-700 inline-block text-left shadow-inner w-full sm:w-auto">
                        ${achHtml}
                    </div>
                    <p class="text-white text-lg md:text-2xl font-semibold mt-3 md:mt-4 italic opacity-90 mb-6 md:mb-8 px-2">"${slide.quote}"</p>
                    <p class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 animate-pulse">${slide.footer}</p>
                </div>
            </div>
        `;
    }
    // Remaining canvas slides untouched
    else if (slide.type === 'animated-tree') {
        html = `
            <div class="animate-fadeIn max-w-5xl w-full">
                <h2 class="text-2xl md:text-4xl font-bold text-white mb-4 md:mb-6 text-center">${slide.title}</h2>
                <div class="bg-white rounded-xl p-4 md:p-6 shadow-2xl overflow-hidden flex flex-col items-center">
                    <p class="text-purple-700 text-base md:text-xl text-center mb-3 md:mb-4 font-semibold">${slide.subtitle}</p>
                    <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-lg p-3 md:p-4 mb-4 md:mb-5 shadow-inner border border-purple-200 w-full">
                        <h3 class="text-purple-800 font-bold text-sm md:text-lg mb-1">What is a Tree Diagram?</h3>
                        <p class="text-gray-700 text-xs md:text-sm">A tree diagram is a visual tool that shows all possible outcomes of an experiment. Each branch represents a different choice or outcome, making it easy to see and count all possibilities.</p>
                    </div>
                    <canvas id="animated-tree-canvas" class="w-full h-auto max-h-[40vh] object-contain aspect-[2/1] rounded-lg border-2 border-purple-200 bg-[#0F172A] shadow-md"></canvas>
                </div>
            </div>
        `;
        setTimeout(initAnimatedTree, 100);
    }
    else if (slide.type === 'tree') {
        html = `
            <div class="animate-fadeIn max-w-5xl w-full">
                <h2 class="text-2xl md:text-4xl font-bold text-white mb-4 md:mb-6 text-center">${slide.title}</h2>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                    <div class="bg-slate-800/80 rounded-xl p-4 md:p-6 border-2 border-purple-400/30 shadow-2xl flex flex-col justify-center">
                        <p class="text-white text-base md:text-xl mb-4 md:mb-6 font-semibold border-b border-purple-500/30 pb-3">${slide.description}</p>
                        <div class="space-y-2 md:space-y-3">
                            ${slide.features.map(feat => `<p class="text-white text-sm md:text-lg flex items-center"><span class="text-green-400 font-bold mr-2 text-lg md:text-xl">✓</span> ${feat}</p>`).join('')}
                        </div>
                        <button onclick="initMysticalTree()" class="mt-6 md:mt-8 bg-gradient-to-r from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white font-bold py-2 md:py-3 px-4 md:px-6 rounded-lg w-full shadow-[0_0_15px_rgba(0,255,255,0.3)] transition transform hover:-translate-y-1 text-xs md:text-sm">
                            Regrow Tree & Play Sounds
                        </button>
                    </div>
                    
                    <div class="relative bg-gradient-to-b from-slate-900 to-black rounded-xl border-2 border-purple-500/30 overflow-hidden shadow-[0_0_30px_rgba(0,255,255,0.2)] flex items-center justify-center min-h-[250px] md:min-h-[350px]">
                        <canvas id="mystical-tree-canvas" class="w-full h-auto max-h-[40vh] object-contain block aspect-[4/3]"></canvas>
                        <div class="absolute top-2 left-2 md:top-3 md:left-3 bg-black/70 backdrop-blur rounded p-1.5 md:p-2 border border-cyan-400/30 shadow-md pointer-events-none">
                            <p class="text-cyan-300 text-[8px] md:text-[10px] font-mono mb-0.5">🌟 Mystical Tree Diagram</p>
                            <p class="text-purple-300 text-[8px] md:text-[10px]">Each leaf = Outcome</p>
                            <p class="text-cyan-300 text-[8px] md:text-[10px]">Watch it grow!</p>

        `;
        setTimeout(initMysticalTree, 100);
    }

    container.innerHTML = html;
}

// ==========================================
// ANIMATED TREE DIAGRAM LOGIC
// ==========================================
function initAnimatedTree() {
    cancelAnimations();
    const canvas = document.getElementById('animated-tree-canvas');
    if (!canvas) return;
    
    canvas.width = 1000;
    canvas.height = 500;
    const ctx = canvas.getContext('2d');

    const steps = [
      { type: 'startPoint', duration: 800 },
      { type: 'callout1', duration: 1200 },
      { type: 'firstBranch1', duration: 800 },
      { type: 'firstBranch2', duration: 800 },
      { type: 'callout2', duration: 1200 },
      { type: 'secondBranch1', duration: 800 },
      { type: 'secondBranch2', duration: 800 },
      { type: 'secondBranch3', duration: 800 },
      { type: 'secondBranch4', duration: 800 },
      { type: 'callout3', duration: 1200 },
      { type: 'callout4', duration: 1200 },
      { type: 'pulse', duration: 3000 }
    ];

    const elements = {
      startPoint: { x: 100, y: 250, show: false },
      branches: [
        { x1: 100, y1: 250, x2: 350, y2: 150, label: 'H', prob: '0.5', show: false, progress: 0 },
        { x1: 100, y1: 250, x2: 350, y2: 350, label: 'T', prob: '0.5', show: false, progress: 0 },
        { x1: 350, y1: 150, x2: 600, y2: 100, label: 'H', prob: '0.5', show: false, progress: 0 },
        { x1: 350, y1: 150, x2: 600, y2: 200, label: 'T', prob: '0.5', show: false, progress: 0 },
        { x1: 350, y1: 350, x2: 600, y2: 300, label: 'H', prob: '0.5', show: false, progress: 0 },
        { x1: 350, y1: 350, x2: 600, y2: 400, label: 'T', prob: '0.5', show: false, progress: 0 }
      ],
      outcomes: [
        { x: 650, y: 100, label: 'HH', show: false },
        { x: 650, y: 200, label: 'HT', show: false },
        { x: 650, y: 300, label: 'TH', show: false },
        { x: 650, y: 400, label: 'TT', show: false }
      ],
      callouts: [
        { x: 100, y: 180, text: 'Starts with\none point', show: false },
        { x: 225, y: 80, text: 'Branches show\noptions', show: false },
        { x: 750, y: 150, text: 'Each path is\none outcome', show: false },
        { x: 750, y: 450, text: 'Easy to count\npossibilities', show: false }
      ]
    };

    let animationStep = 0;
    let animationProgressTime = 0;
    let pulseTime = 0;
    let pulseStartTime = null;

    function drawCircle(x, y, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8B5CF6';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawBranch(x1, y1, x2, y2, progress = 1) {
      const currentX = x1 + (x2 - x1) * progress;
      const currentY = y1 + (y2 - y1) * progress;

      ctx.strokeStyle = '#8B5CF6';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(currentX, currentY);
      ctx.stroke();
    }

    function drawLabel(x1, y1, x2, y2, text, prob) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(midX - 20, midY - 18, 40, 36);
      
      ctx.fillStyle = '#8B5CF6';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, midX, midY);
      
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const offsetX = Math.sin(angle) * 25;
      const offsetY = -Math.cos(angle) * 25;
      
      ctx.fillStyle = '#06B6D4';
      ctx.font = 'bold 16px Arial';
      ctx.fillText(prob, midX + offsetX, midY + offsetY);
    }

    function drawOutcome(x, y, text, pulse = 0) {
      const scale = 1 + pulse * 0.2;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      
      ctx.fillStyle = '#8B5CF6';
      ctx.strokeStyle = '#EC4899';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-40, -25, 80, 50, 10);
      ctx.fill();
      ctx.stroke();
      
      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 0);
      
      ctx.restore();
    }

    function drawCallout(x, y, text, show = false) {
      if (!show) return;

      const lines = text.split('\n');
      const lineHeight = 24;
      const padding = 15;
      const width = 160;
      const height = lines.length * lineHeight + padding * 2;

      ctx.fillStyle = '#FCD34D';
      ctx.strokeStyle = '#8B5CF6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#FCD34D';
      ctx.beginPath();
      ctx.moveTo(x, y + height / 2);
      ctx.lineTo(x - 15, y + height / 2 - 10);
      ctx.lineTo(x - 15, y + height / 2 + 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#1F2937';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      lines.forEach((line, i) => {
        ctx.fillText(line, x + padding, y + padding + 18 + i * lineHeight);
      });
    }

    function animateFrame() {
      ctx.fillStyle = '#0F172A';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (elements.startPoint.show) {
        drawCircle(elements.startPoint.x, elements.startPoint.y, 15, '#06B6D4');
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Start', 100, 220);
      }

      elements.branches.forEach((branch) => {
        if (branch.show) {
          drawBranch(branch.x1, branch.y1, branch.x2, branch.y2, branch.progress);
          if (branch.progress >= 1) {
            drawLabel(branch.x1, branch.y1, branch.x2, branch.y2, branch.label, branch.prob);
            drawCircle(branch.x2, branch.y2, 12, '#06B6D4');
          }
        }
      });

      elements.outcomes.forEach((outcome) => {
        if (outcome.show) {
          let pulse = 0;
          if (animationStep === steps.length - 1) {
            const elapsedPulseTime = pulseStartTime ? (Date.now() - pulseStartTime) / 1000 : 0;
            if (elapsedPulseTime < 10) {
              pulse = Math.abs(Math.sin(pulseTime * 3));
            }
          }
          drawOutcome(outcome.x, outcome.y, outcome.label, pulse);
        }
      });

      elements.callouts.forEach(callout => {
        drawCallout(callout.x, callout.y, callout.text, callout.show);
      });

      ctx.fillStyle = '#94A3B8';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      if (elements.branches[0].show) ctx.fillText('First Flip', 225, 40);
      if (elements.branches[2].show) ctx.fillText('Second Flip', 475, 40);
      if (elements.outcomes[0].show) ctx.fillText('Outcomes', 700, 40);
    }

    function updateAnimation(timestamp) {
      if (!animationProgressTime) animationProgressTime = timestamp;
      
      const elapsed = timestamp - animationProgressTime;
      const currentStep = steps[animationStep];
      
      if (!currentStep) {
        pulseTime += 0.05;
        animateFrame();
        activeAnimationId = requestAnimationFrame(updateAnimation);
        return;
      }

      const progress = Math.min(elapsed / currentStep.duration, 1);

      switch (currentStep.type) {
        case 'startPoint':
          elements.startPoint.show = true;
          break;
        case 'callout1':
          elements.callouts[0].show = true;
          break;
        case 'firstBranch1':
          elements.branches[0].show = true;
          elements.branches[0].progress = progress;
          break;
        case 'firstBranch2':
          elements.branches[1].show = true;
          elements.branches[1].progress = progress;
          break;
        case 'callout2':
          elements.callouts[0].show = false;
          elements.callouts[1].show = true;
          break;
        case 'secondBranch1':
          elements.branches[2].show = true;
          elements.branches[2].progress = progress;
          break;
        case 'secondBranch2':
          elements.branches[3].show = true;
          elements.branches[3].progress = progress;
          break;
        case 'secondBranch3':
          elements.branches[4].show = true;
          elements.branches[4].progress = progress;
          break;
        case 'secondBranch4':
          elements.branches[5].show = true;
          elements.branches[5].progress = progress;
          if (progress >= 1) elements.outcomes.forEach(o => o.show = true);
          break;
        case 'callout3':
          elements.callouts[1].show = false;
          elements.callouts[2].show = true;
          break;
        case 'callout4':
          elements.callouts[2].show = false;
          elements.callouts[3].show = true;
          break;
        case 'pulse':
          if (!pulseStartTime) pulseStartTime = Date.now();
          pulseTime += 0.05;
          break;
      }

      animateFrame();

      if (progress >= 1 && animationStep < steps.length - 1) {
        animationStep++;
        animationProgressTime = timestamp;
      }

      activeAnimationId = requestAnimationFrame(updateAnimation);
    }

    setTimeout(() => {
      activeAnimationId = requestAnimationFrame(updateAnimation);
    }, 500);
}

// ==========================================
// MYSTICAL TREE LOGIC
// ==========================================
function initMysticalTree() {
    cancelAnimations();
    const canvas = document.getElementById('mystical-tree-canvas');
    if (!canvas) return;
    
    canvas.width = 800;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');

    let branches = [];
    let leaves = [];
    let swayOffset = 0;

    class Branch {
      constructor(x1, y1, x2, y2, depth, prob) {
        this.x1 = x1;
        this.y1 = y1;
        this.x2 = x2;
        this.y2 = y2;
        this.depth = depth;
        this.prob = prob;
        this.progress = 0;
        this.glowIntensity = Math.random() * 0.5 + 0.5;
      }

      update() {
        if (this.progress < 1) {
          this.progress += 0.02;
        }
      }

      draw(ctx, sway, canvasHeight) {
        if (this.progress <= 0) return;

        const currentX2 = this.x1 + (this.x2 - this.x1) * this.progress;
        const currentY2 = this.y1 + (this.y2 - this.y1) * this.progress;
        const swayAmount = sway * (1 - this.y2 / canvasHeight) * 5;
        const finalX2 = currentX2 + swayAmount;

        const gradient = ctx.createLinearGradient(this.x1, this.y1, finalX2, currentY2);
        const purple = `rgba(138, 43, 226, ${0.8 * this.glowIntensity})`;
        const cyan = `rgba(0, 255, 255, ${0.6 * this.glowIntensity})`;
        gradient.addColorStop(0, purple);
        gradient.addColorStop(1, cyan);

        ctx.shadowBlur = 15 + Math.sin(Date.now() * 0.001 + this.depth) * 5;
        ctx.shadowColor = this.depth % 2 === 0 ? purple : cyan;
        ctx.strokeStyle = gradient;
        ctx.lineWidth = Math.max(1, 8 - this.depth);
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(this.x1, this.y1);
        ctx.lineTo(finalX2, currentY2);
        ctx.stroke();

        if (this.depth > 0 && this.progress > 0.8) {
          ctx.shadowBlur = 10;
          ctx.fillStyle = `rgba(255, 255, 255, ${0.3 * this.progress})`;
          ctx.font = '12px Arial';
          ctx.fillText('→', (this.x1 + finalX2) / 2, (this.y1 + currentY2) / 2);
        }
      }
    }

    class Leaf {
      constructor(x, y, prob, delay) {
        this.x = x;
        this.y = y;
        this.prob = prob;
        this.delay = delay;
        this.age = 0;
        this.size = 0;
        this.maxSize = 25 + Math.random() * 15;
        this.hue = Math.random() > 0.5 ? 270 : 180;
      }

      update() {
        if (this.age > this.delay) {
          if (this.size < this.maxSize) {
            this.size += 0.5;
          }
        }
        this.age++;
      }

      draw(ctx, sway) {
        if (this.size <= 0) return;

        const swayAmount = sway * 3;
        const x = this.x + swayAmount;

        ctx.shadowBlur = 20;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
        
        const gradient = ctx.createRadialGradient(x, this.y, 0, x, this.y, this.size);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0.9)`);
        gradient.addColorStop(0.7, `hsla(${this.hue}, 100%, 50%, 0.6)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 30%, 0.1)`);
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        if (this.size >= this.maxSize * 0.8) {
          ctx.shadowBlur = 5;
          ctx.fillStyle = 'white';
          ctx.font = 'bold 14px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.prob, x, this.y);
        }
      }
    }

    const playSproutSound = (frequency = 200) => {
      try {
          if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(frequency * 1.5, audioContext.currentTime + 0.1);
          
          gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.15);
      } catch (e) {}
    };

    const playLeafSound = () => {
      try {
          if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.05);
          
          gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.1);
      } catch(e) {}
    };

    const createTree = (x, y, length, angle, depth, prob, maxDepth = 5) => {
      if (depth > maxDepth) return;

      const x2 = x + length * Math.cos(angle);
      const y2 = y + length * Math.sin(angle);

      const branch = new Branch(x, y, x2, y2, depth, prob);
      branches.push(branch);

      setTimeout(() => {
        playSproutSound(200 + depth * 50);
      }, depth * 200);

      if (depth >= 4) {
        const probValues = ['HH', 'HT', 'TH', 'TT'];
        const leafProb = probValues[branches.filter(b => b.depth >= 4).length % 4];
        const leaf = new Leaf(x2, y2, leafProb, depth * 200 + 500);
        leaves.push(leaf);
        
        setTimeout(() => {
          playLeafSound();
        }, depth * 200 + 500);
      }

      if (depth < maxDepth) {
        const angleChange = Math.PI / 6;
        const lengthReduction = 0.7;
        
        createTree(x2, y2, length * lengthReduction, angle - angleChange, depth + 1, prob * 0.5, maxDepth);
        createTree(x2, y2, length * lengthReduction, angle + angleChange, depth + 1, prob * 0.5, maxDepth);
      }
    };

    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 50; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = Math.random() * 2;
        ctx.fillStyle = `rgba(138, 43, 226, ${Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      swayOffset = Math.sin(Date.now() * 0.001) * 2;

      branches.forEach(branch => {
        branch.update();
        branch.draw(ctx, swayOffset, canvas.height);
      });

      leaves.forEach(leaf => {
        leaf.update();
        leaf.draw(ctx, swayOffset);
      });

      activeAnimationId = requestAnimationFrame(animate);
    };

    const startX = canvas.width / 2;
    const startY = canvas.height - 30;
    const initialLength = 150;
    const initialAngle = -Math.PI / 2;

    createTree(startX, startY, initialLength, initialAngle, 0, 1.0, 5);
    animate();
}
