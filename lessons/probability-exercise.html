<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen Z Probability - Malaysian Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #764ba2;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        .scenario-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .scenario-btn {
            background: white;
            border: 3px solid #667eea;
            padding: 15px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 200px;
        }
        .scenario-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .scenario-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #764ba2;
        }
        .difficulty {
            font-size: 0.8em;
            margin-top: 5px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .easy { background: #4ade80; color: white; }
        .medium { background: #fbbf24; color: white; }
        .hard { background: #f87171; color: white; }
        .calculate { background: #a855f7; color: white; }
        .scenario-content {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .scenario-title {
            font-size: 1.5em;
            color: #764ba2;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .scenario-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .view-toggle {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .view-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .view-btn.active {
            background: #764ba2;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.6);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .emoji {
            font-size: 2em;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Probability Examples</h1>
        <p class="subtitle">Interactive Learning with Tree Diagrams and Tables</p>
        
        <div class="scenario-selector">
            <div class="scenario-btn active" onclick="selectScenario(0)">
                <div class="emoji">🧋</div>
                <div>Bubble Tea Order</div>
                <div class="difficulty easy">EASY</div>
            </div>
            <div class="scenario-btn" onclick="selectScenario(1)">
                <div class="emoji">📱</div>
                <div>TikTok Post</div>
                <div class="difficulty medium">MEDIUM</div>
            </div>
            <div class="scenario-btn" onclick="selectScenario(2)">
                <div class="emoji">🛵</div>
                <div>Food Delivery</div>
                <div class="difficulty hard">HARD</div>
            </div>
            <div class="scenario-btn" onclick="selectScenario(3)">
                <div class="emoji">🎁</div>
                <div>Lucky Draw</div>
                <div class="difficulty calculate">CALCULATE</div>
            </div>
            <div class="scenario-btn" onclick="selectScenario(4)">
                <div class="emoji">🎮</div>
                <div>ML Ranked</div>
                <div class="difficulty calculate">CALCULATE</div>
            </div>
        </div>

        <div class="scenario-content" id="scenarioContent"></div>

        <div class="view-toggle">
            <button class="view-btn active" onclick="switchView('tree')">🌳 Tree Diagram</button>
            <button class="view-btn" onclick="switchView('table')">📊 Table View</button>
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <button class="start-btn" onclick="startAnimation()">✅ Show All Answers</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let currentScenario = 0;
        let currentView = 'tree';
        let animationFrame;
        let animationStep = 0;
        let animationProgress = 0;
        let showAnswers = false;

        const scenarios = [
            {
                emoji: '🧋',
                title: 'Bubble Tea Order at Tealive',
                description: 'You\'re ordering bubble tea. First, choose your drink (Brown Sugar or Matcha). Then, pick your topping (Pearl or Jelly). What are all possible combinations?',
                difficulty: 'EASY',
                events: ['Drink Choice', 'Topping Choice'],
                options: [
                    { label: 'Brown Sugar', short: 'BS', prob: 0.5, display: '1/2', calculate: true },
                    { label: 'Matcha', short: 'M', prob: 0.5, display: '1/2', calculate: true }
                ],
                options2: [
                    { label: 'Pearl', short: 'P', prob: 0.5, display: '1/2', calculate: true },
                    { label: 'Jelly', short: 'J', prob: 0.5, display: '1/2', calculate: true }
                ],
                outcomes: [
                    'BS, Pearl',
                    'BS, Jelly',
                    'Matcha, Pearl',
                    'Matcha, Jelly'
                ],
                needsCalculation: true
            },
            {
                emoji: '📱',
                title: 'Posting on TikTok',
                description: 'You post a video on TikTok. It can go Viral (P=0.3) or Flop (P=0.7). Whether or not it goes viral, a brand might reach out for a deal: Yes (P=0.4) or No (P=0.6). What are all possible outcomes?',
                difficulty: 'MEDIUM',
                events: ['Video Result', 'Brand Deal'],
                options: [
                    { label: 'Viral', short: 'V', prob: 0.3 },
                    { label: 'Flop', short: 'F', prob: 0.7 }
                ],
                options2: [
                    { label: 'Deal', short: 'D', prob: 0.4 },
                    { label: 'No Deal', short: 'N', prob: 0.6 }
                ],
                outcomes: [
                    'Viral, Deal',
                    'Viral, No Deal',
                    'Flop, Deal',
                    'Flop, No Deal'
                ],
                note: 'Note: Here the brand deal does not depend on the video result, so the two events are independent and you multiply along each branch.'
            },
            {
                emoji: '🛵',
                title: 'GrabFood Delivery',
                description: 'You order GrabFood. Delivery can be Fast or Slow. Food arrives Hot or Cold. You decide to Tip or Not Tip. What are all possible outcomes?',
                difficulty: 'HARD',
                events: ['Delivery Speed', 'Food Temp', 'Tip Decision'],
                options: [
                    { label: 'Fast', short: 'F', prob: 0.6, display: '60%', calculate: true },
                    { label: 'Slow', short: 'S', prob: 0.4, display: '40%', calculate: true }
                ],
                options2: [
                    { label: 'Hot', short: 'H', prob: 0.7, display: '70%', calculate: true },
                    { label: 'Cold', short: 'C', prob: 0.3, display: '30%', calculate: true }
                ],
                options3: [
                    { label: 'Tip', short: 'T', prob: 0.5, display: '50%', calculate: true },
                    { label: 'No Tip', short: 'N', prob: 0.5, display: '50%', calculate: true }
                ],
                outcomes: [
                    'F, H, T', 'F, H, N', 'F, C, T', 'F, C, N',
                    'S, H, T', 'S, H, N', 'S, C, T', 'S, C, N'
                ],
                isThreeLevel: true,
                needsCalculation: true
            },
            {
                emoji: '🎁',
                title: 'Shopee Lucky Draw',
                description: 'A box contains 3 red balls and 2 blue balls (5 total). You draw one ball, put it back, then draw again. Calculate the probability for each color on each draw, then find all outcomes.',
                difficulty: 'MEDIUM',
                events: ['First Draw', 'Second Draw'],
                options: [
                    { label: 'Red', short: 'R', prob: 0.6, calculate: true, hint: '3 red out of 5 total' },
                    { label: 'Blue', short: 'B', prob: 0.4, calculate: true, hint: '2 blue out of 5 total' }
                ],
                options2: [
                    { label: 'Red', short: 'R', prob: 0.6, calculate: true, hint: '3 red out of 5 total' },
                    { label: 'Blue', short: 'B', prob: 0.4, calculate: true, hint: '2 blue out of 5 total' }
                ],
                outcomes: [
                    'Red, Red',
                    'Red, Blue',
                    'Blue, Red',
                    'Blue, Blue'
                ],
                note: 'Hint: Probability = <span class="sp-frac"><span>favorable outcomes</span><span>total outcomes</span></span>. For red: 3/5 = ?',
                needsCalculation: true
            },
            {
                emoji: '🎮',
                title: 'Mobile Legends Rank Game',
                description: 'In ranked games you either Win or Lose. From your past 20 games: 12 Wins and 8 Losses. If you WIN, you gain a star (70%) or your rank stays the same (30%). If you LOSE, you lose a star (80%) or star protection keeps your rank the same (20%). Calculate all probabilities and outcomes.',
                difficulty: 'HARD',
                events: ['Game Result', 'Rank Change'],
                options: [
                    { label: 'Win', short: 'W', prob: 0.6, calculate: true, hint: '12 wins out of 20 games',
                      next: [
                          { label: 'Star+', short: '+', prob: 0.7 },
                          { label: 'Same', short: '=', prob: 0.3 }
                      ] },
                    { label: 'Lose', short: 'L', prob: 0.4, calculate: true, hint: '8 losses out of 20 games',
                      next: [
                          { label: 'Star−', short: '−', prob: 0.8 },
                          { label: 'Same', short: '=', prob: 0.2 }
                      ] }
                ],
                // Column headings for the table view; each row uses its own `next` branches.
                options2: [
                    { label: 'Star changes', short: '±' },
                    { label: 'Rank stays', short: '=' }
                ],
                outcomes: [
                    'Win, Star+',
                    'Win, Same',
                    'Lose, Star−',
                    'Lose, Same'
                ],
                note: 'Hint: Win probability = 12/20 = ? | Lose = 8/20 = ? The rank change depends on the result, so follow the branches after Win or Lose.',
                needsCalculation: true
            }
        ];

        function selectScenario(index) {
            currentScenario = index;
            showAnswers = false;
            updateButtonText();
            document.querySelectorAll('.scenario-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            updateScenarioContent();
            drawVisualization();
        }

        function switchView(view) {
            currentView = view;
            showAnswers = false;
            updateButtonText();
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(view === 'tree' ? 'Tree' : 'Table'));
            });
            drawVisualization();
        }

        function updateScenarioContent() {
            const scenario = scenarios[currentScenario];
            const content = `
                <div class="scenario-title">${scenario.emoji} ${scenario.title}</div>
                <div class="scenario-description">${scenario.description}</div>
                ${scenario.note ? `<div style="color: #667eea; font-style: italic; margin-top: 10px;">💡 ${scenario.note}</div>` : ''}
            `;
            document.getElementById('scenarioContent').innerHTML = content;
        }

        function drawVisualization() {
            const scenario = scenarios[currentScenario];
            
            if (currentView === 'tree') {
                canvas.width = 1200;
                if (scenario.isThreeLevel) {
                    canvas.height = 700;
                } else if (scenario.isThreeOptions) {
                    canvas.height = 650;
                } else {
                    canvas.height = 500;
                }
                drawTreeDiagram(scenario);
            } else {
                canvas.width = 1000;
                if (scenario.isThreeLevel) {
                    canvas.height = 800;
                } else if (scenario.isThreeOptions) {
                    canvas.height = 700;
                } else {
                    canvas.height = 600;
                }
                drawTable(scenario);
            }
        }

        function drawTreeDiagram(scenario) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const startX = 100;
            const startY = canvas.height / 2;
            
            if (scenario.isThreeLevel) {
                drawThreeLevelTree(scenario);
            } else {
                drawTwoLevelTree(scenario);
            }
        }

        function drawTwoLevelTree(scenario) {
            const startX = 100;
            const startY = canvas.height / 2;
            
            // Start point
            drawCircle(startX, startY, 15, '#667eea');
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Start', startX, startY - 25);
            
            // First level
            const level1X = 350;
            const numOptions = scenario.options.length;
            const spacing1 = numOptions === 2 ? 150 : 120;
            const startOffset = numOptions === 2 ? spacing1 : spacing1 * 1.5;
            
            scenario.options.forEach((opt, i) => {
                const y = startY - startOffset + i * spacing1 * (numOptions === 2 ? 2 : 1.5);
                drawBranch(startX, startY, level1X, y);
                drawCircle(level1X, y, 12, '#667eea');
                
                if (scenario.needsCalculation && opt.calculate && !showAnswers) {
                    drawBranchLabel(startX, startY, level1X, y, opt.short, '?', 'P=?');
                } else {
                    const displayProb = opt.display ? `P=${opt.display}` : null;
                    drawBranchLabel(startX, startY, level1X, y, opt.short, opt.prob, displayProb);
                }
            });
            
            // Second level
            const level2X = 650;
            const spacing2 = 70;
            
            let outcomeIndex = 0;
            scenario.options.forEach((opt1, i) => {
                const y1 = startY - startOffset + i * spacing1 * (numOptions === 2 ? 2 : 1.5);
                
                (opt1.next || scenario.options2).forEach((opt2, j) => {
                    const y2 = y1 - spacing2 + j * spacing2 * 2;
                    drawBranch(level1X, y1, level2X, y2);
                    drawCircle(level2X, y2, 12, '#667eea');
                    
                    if (scenario.needsCalculation && opt2.calculate && !showAnswers) {
                        drawBranchLabel(level1X, y1, level2X, y2, opt2.short, '?', 'P=?');
                    } else {
                        const displayProb = opt2.display ? `P=${opt2.display}` : null;
                        drawBranchLabel(level1X, y1, level2X, y2, opt2.short, opt2.prob, displayProb);
                    }
                    
                    // Outcome
                    const prob = (opt1.prob * opt2.prob).toFixed(3);
                    const displayOutcomeProb = (scenario.needsCalculation && !showAnswers) ? '?' : prob;
                    drawOutcome(level2X + 80, y2, scenario.outcomes[outcomeIndex], displayOutcomeProb);
                    outcomeIndex++;
                });
            });
            
            // Labels
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(scenario.events[0], level1X, 30);
            ctx.fillText(scenario.events[1], level2X, 30);
        }

        function drawThreeLevelTree(scenario) {
            const startX = 80;
            const startY = canvas.height / 2;
            
            // Start point
            drawCircle(startX, startY, 15, '#667eea');
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Start', startX, startY - 25);
            
            // Level 1
            const level1X = 250;
            const spacing1 = 180;
            
            scenario.options.forEach((opt, i) => {
                const y = startY - spacing1 + i * spacing1 * 2;
                drawBranch(startX, startY, level1X, y);
                drawCircle(level1X, y, 10, '#667eea');
                
                if (scenario.needsCalculation && opt.calculate && !showAnswers) {
                    drawBranchLabel(startX, startY, level1X, y, opt.short, '?', 'P=?');
                } else {
                    const displayProb = opt.display ? `P=${opt.display}` : null;
                    drawBranchLabel(startX, startY, level1X, y, opt.short, opt.prob, displayProb);
                }
            });
            
            // Level 2
            const level2X = 450;
            const spacing2 = 85;
            
            scenario.options.forEach((opt1, i) => {
                const y1 = startY - spacing1 + i * spacing1 * 2;
                
                scenario.options2.forEach((opt2, j) => {
                    const y2 = y1 - spacing2 + j * spacing2 * 2;
                    drawBranch(level1X, y1, level2X, y2);
                    drawCircle(level2X, y2, 10, '#667eea');
                    
                    if (scenario.needsCalculation && opt2.calculate && !showAnswers) {
                        drawBranchLabel(level1X, y1, level2X, y2, opt2.short, '?', 'P=?');
                    } else {
                        const displayProb = opt2.display ? `P=${opt2.display}` : null;
                        drawBranchLabel(level1X, y1, level2X, y2, opt2.short, opt2.prob, displayProb);
                    }
                });
            });
            
            // Level 3
            const level3X = 680;
            const spacing3 = 40;
            
            let outcomeIndex = 0;
            scenario.options.forEach((opt1, i) => {
                const y1 = startY - spacing1 + i * spacing1 * 2;
                
                scenario.options2.forEach((opt2, j) => {
                    const y2 = y1 - spacing2 + j * spacing2 * 2;
                    
                    scenario.options3.forEach((opt3, k) => {
                        const y3 = y2 - spacing3 + k * spacing3 * 2;
                        drawBranch(level2X, y2, level3X, y3);
                        drawCircle(level3X, y3, 8, '#667eea');
                        
                        if (scenario.needsCalculation && opt3.calculate && !showAnswers) {
                            drawBranchLabel(level2X, y2, level3X, y3, opt3.short, '?', 'P=?');
                        } else {
                            const displayProb = opt3.display ? `P=${opt3.display}` : null;
                            drawBranchLabel(level2X, y2, level3X, y3, opt3.short, opt3.prob, displayProb);
                        }
                        
                        // Outcome
                        const prob = (opt1.prob * opt2.prob * opt3.prob).toFixed(3);
                        const displayOutcomeProb = (scenario.needsCalculation && !showAnswers) ? '?' : prob;
                        drawOutcome(level3X + 60, y3, scenario.outcomes[outcomeIndex], displayOutcomeProb);
                        outcomeIndex++;
                    });
                });
            });
            
            // Labels
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(scenario.events[0], level1X, 25);
            ctx.fillText(scenario.events[1], level2X, 25);
            ctx.fillText(scenario.events[2], level3X, 25);
        }

        function drawTable(scenario) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (scenario.isThreeLevel) {
                drawThreeLevelTable(scenario);
            } else {
                drawTwoLevelTable(scenario);
            }
        }

        function drawTwoLevelTable(scenario) {
            const startX = 200;
            const startY = 150;
            const cellW = 180;
            const cellH = 100;
            const headerH = 70;
            const numRows = scenario.options.length;
            
            // Adjust for 3 options
            if (numRows > 2) {
                canvas.height = 700;
            }
            
            // Title
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Outcome Table', canvas.width / 2, 50);
            
            // Column headers
            ctx.fillStyle = '#667eea';
            ctx.fillRect(startX, startY, cellW * 2, headerH);
            ctx.strokeStyle = '#764ba2';
            ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, cellW * 2, headerH);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(scenario.events[1], startX + cellW, startY + headerH / 2);
            
            // Column labels
            scenario.options2.forEach((opt, i) => {
                ctx.fillStyle = '#667eea';
                ctx.fillRect(startX + i * cellW, startY + headerH, cellW, headerH);
                ctx.strokeRect(startX + i * cellW, startY + headerH, cellW, headerH);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(opt.label, startX + i * cellW + cellW / 2, startY + headerH + headerH / 2);
            });
            
            // Row header
            ctx.save();
            ctx.translate(startX - 70, startY + headerH + cellH * (numRows / 2));
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(scenario.events[0], 0, 0);
            ctx.restore();
            
            // Rows
            let outcomeIndex = 0;
            scenario.options.forEach((opt1, i) => {
                // Row label
                ctx.fillStyle = '#667eea';
                ctx.fillRect(startX - 90, startY + headerH * 2 + i * cellH, 90, cellH);
                ctx.strokeRect(startX - 90, startY + headerH * 2 + i * cellH, 90, cellH);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(opt1.label, startX - 45, startY + headerH * 2 + i * cellH + cellH / 2);
                
                // Cells
                (opt1.next || scenario.options2).forEach((opt2, j) => {
                    const x = startX + j * cellW;
                    const y = startY + headerH * 2 + i * cellH;
                    
                    ctx.fillStyle = '#e0e7ff';
                    ctx.fillRect(x, y, cellW, cellH);
                    ctx.strokeRect(x, y, cellW, cellH);
                    
                    ctx.fillStyle = '#764ba2';
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText(scenario.outcomes[outcomeIndex], x + cellW / 2, y + cellH / 2 - 10);
                    
                    ctx.font = '14px Arial';
                    if (scenario.needsCalculation && !showAnswers) {
                        ctx.fillText('P = ?', x + cellW / 2, y + cellH / 2 + 20);
                    } else {
                        const prob = (opt1.prob * opt2.prob).toFixed(3);
                        ctx.fillText(`P = ${prob}`, x + cellW / 2, y + cellH / 2 + 20);
                    }
                    
                    outcomeIndex++;
                });
            });
        }

        function drawThreeLevelTable(scenario) {
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('All Possible Outcomes', canvas.width / 2, 40);
            
            ctx.font = '14px Arial';
            ctx.fillStyle = '#666';
            ctx.fillText('(For 3 events, listing format is clearer than a 3D table)', canvas.width / 2, 65);
            
            const startY = 120;
            const rowHeight = 70;
            const cols = 4;
            const cellW = 220;
            const cellH = 60;
            
            scenario.outcomes.forEach((outcome, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = 50 + col * cellW;
                const y = startY + row * rowHeight;
                
                // Background
                ctx.fillStyle = '#667eea';
                ctx.fillRect(x, y, cellW - 10, cellH);
                ctx.strokeStyle = '#764ba2';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, cellW - 10, cellH);
                
                // Outcome
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(outcome, x + (cellW - 10) / 2, y + cellH / 2 - 8);
                
                // Probability
                const parts = outcome.split(', ');
                let prob = 1;
                parts.forEach((part, idx) => {
                    const opts = [scenario.options, scenario.options2, scenario.options3][idx];
                    const opt = opts.find(o => o.short === part);
                    if (opt) prob *= opt.prob;
                });
                
                ctx.font = '12px Arial';
                const displayProb = (scenario.needsCalculation && !showAnswers) ? '?' : prob.toFixed(3);
                ctx.fillText(`P = ${displayProb}`, x + (cellW - 10) / 2, y + cellH / 2 + 12);
            });
        }

        function drawCircle(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#764ba2';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawBranch(x1, y1, x2, y2) {
            ctx.strokeStyle = '#764ba2';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawBranchLabel(x1, y1, x2, y2, label, prob, displayProb) {
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;
            
            // Label above branch
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const offsetX = Math.sin(angle) * 20;
            const offsetY = -Math.cos(angle) * 20;
            
            ctx.fillStyle = '#764ba2';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(label, x2, y2 - 18);
            
            // Probability
            ctx.fillStyle = '#667eea';
            ctx.font = 'bold 12px Arial';
            const probText = displayProb || (prob === '?' ? '?' : `P=${prob}`);
            const fraction = probText.match(/^P=(\d+)\/(\d+)$/);
            if (fraction) drawFraction('P =', fraction[1], fraction[2], midX + offsetX, midY + offsetY);
            else ctx.fillText(probText, midX + offsetX, midY + offsetY);
        }

        // Draws a label such as "P = 1/2" with the fraction stacked (top over bottom),
        // centred on x, y, in the current font and colour.
        function drawFraction(prefix, top, bottom, x, y) {
            const size = parseInt(ctx.font.match(/(\d+)px/)[1], 10);
            const prefixW = ctx.measureText(prefix + ' ').width;
            const fracW = Math.max(ctx.measureText(top).width, ctx.measureText(bottom).width) + 4;
            const left = x - (prefixW + fracW) / 2;
            const baseline = ctx.textBaseline;
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            // fillText uses the caller's baseline; convert y to the middle of the text
            const midY = baseline === 'middle' ? y : y - size * 0.35;
            ctx.fillText(prefix, left, midY);
            ctx.textAlign = 'center';
            const fracX = left + prefixW + fracW / 2;
            ctx.fillText(top, fracX, midY - size * 0.62);
            ctx.fillText(bottom, fracX, midY + size * 0.72);
            ctx.fillRect(left + prefixW, midY - 0.5, fracW, 1.5);
            ctx.restore();
        }

        function drawOutcome(x, y, label, prob) {
            const width = 120;
            const height = 50;
            
            ctx.fillStyle = '#667eea';
            ctx.fillRect(x - width/2, y - height/2, width, height);
            ctx.strokeStyle = '#764ba2';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - width/2, y - height/2, width, height);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y - 8);
            
            ctx.font = '11px Arial';
            ctx.fillText(`P=${prob}`, x, y + 12);
        }

        function updateButtonText() {
            const btn = document.querySelector('.start-btn');
            
            if (showAnswers) {
                btn.textContent = '🔄 Hide Answers';
            } else {
                btn.textContent = '✅ Show All Answers';
            }
        }

        function startAnimation() {
            showAnswers = !showAnswers;
            updateButtonText();
            drawVisualization();
        }

        // Initialize
        updateScenarioContent();
        updateButtonText();
        drawVisualization();
    </script>
</body>
</html>
